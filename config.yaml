# TrendForge Configuration
# AI Faceless YouTube Video Generator

opencode:
  base_url: http://localhost:11434/v1
  model: minimax-m2.5:cloud
  temperature: 0.7
  # Local Ollama/OpenCode runs are intentionally uncapped.
  # Set these to numbers only when using a metered/hosted LLM.
  max_tokens:
  input_token_budget:
  analysis_source_chars:
  script_item_chars:

scraping:
  max_sources: 40
  regions:
    - US
    - GB
    - AU
  reddit_subreddits:
    - worldnews
    - technology
    - science
    - todayilearned
  timeout: 30
  delay: 2

research:
  target_source_count: 40
  min_evidence_items: 20
  specialist_sources: true
  allowed_source_domains: []
  blocked_source_domains: []
  source_mix:
    news: 0.35
    reddit: 0.2
    wiki: 0.1
    specialist: 0.35

script:
  target_duration_seconds: 330
  min_duration_seconds: 300
  target_segments: 24
  min_words: 760
  max_words: 980
  narrator_character: "A calm technology documentary host: intelligent, composed, curious, analytical, smooth, reflective, professional, slightly mysterious, polished, and trustworthy. The narrator guides viewers through complex technology, business, and innovation stories like a quiet tech historian explaining the hidden story behind modern inventions and companies. Avoid hype, jokes, shouting, slang, clickbait, and influencer-style energy."
  creative_devices:
    - imagine_if
    - small_scene
    - courtroom
    - two_futures
    - hidden_in_plain_sight
    - contrarian_but_fair

tts:
  engine: kokoro
  voice: bf_isabella
  speed: 1.05
  output_format: wav
  sample_rate: 24000

image:
  engine: sd15
  model_id: Lykon/dreamshaper-8
  model_path: ./models/sd15/
  # Fast path: SD1.5 + LCM-LoRA. Keep LoRA unfused on 4GB VRAM to avoid
  # native Torch/CUDA access violations seen with fused acceleration.
  acceleration: lcm_lora
  lcm_lora_id: latent-consistency/lcm-lora-sdv1-5
  lcm_lora_path: D:/hf/hub/models--latent-consistency--lcm-lora-sdv1-5/snapshots/cf2fced511dbe7e26c8d1d397e728fbab875db4b/pytorch_lora_weights.safetensors
  lcm_lora_scale: 0.8
  lcm_fuse_lora: false
  lcm_steps: 6
  lcm_guidance_scale: 1.8
  # GTX 16-series cards are more reliable with a consistent fp32 SD pipeline.
  # CPU offload keeps the all-fp32 path inside 4GB VRAM.
  dtype: fp32
  vae_dtype: fp32
  low_vram_mode: none
  ai_art_enabled: true
  # Avoid reloading the entire pipeline after a black frame.
  retry_fp32_on_black: false
  steps: 10
  guidance_scale: 6.0
  disable_safety_checker: true
  black_frame_guard: true
  nsfw_retry_attempts: 0
  # Generate small enough for 4GB VRAM, then save video-ready 1080p frames.
  width: 768
  height: 432
  upscale_to_output: true
  output_width: 1920
  output_height: 1080
  # realesrgan uses ./models/upscalers/RealESRGAN_x4plus.pth when installed.
  # If the optional dependency/model is unavailable, TrendForge falls back to Lanczos.
  upscale_method: realesrgan
  realesrgan_model_path: ./models/upscalers/RealESRGAN_x4plus.pth
  realesrgan_model_url: https://github.com/xinntao/Real-ESRGAN/releases/download/v0.1.0/RealESRGAN_x4plus.pth
  realesrgan_tile: 256
  upscale_sharpness: 1.12
  upscale_contrast: 1.02
  negative_prompt: "watermark, logo, readable text, fake text, pseudo text, gibberish text, glyphs, letters, numbers, captions, headline, body text, labels, legends, charts, arrows, callouts, UI panels, flat interface screen, plaque, sign, wordmark, inscription, typography, printed words, garbled typography, misspelled labels, dark neon cyberpunk, black background, blurry, distorted UI, extra fingers, low quality, photorealistic, washed out, low contrast, empty close-up, cluttered layout"
  fallback_stock: pixabay
  enable_cpu_offload: true

visuals:
  source: auto
  refresh:
    max_hold_seconds: 14
    min_segment_seconds: 10
    max_extra_visuals_per_segment: 1
    evidence_max_hold_seconds: 10
    evidence_max_extra_visuals_per_segment: 2

source_visuals:
  # cards: always use clean branded source cards
  # auto: try clean source screenshots first, then fall back to source cards
  # screenshots: prefer raw screenshots, still quality-gated
  mode: auto
  screenshot_quality_threshold: 70
  screenshot_retries: 3
  delay_between_sources: 3
  # Vision QA is only for screenshot quality. Research/script/narration continue
  # to use opencode.model above.
  vision_quality_gate: true
  vision_model: qwen3.5:4b
  vision_base_url: http://localhost:11434
  vision_min_score: 75
  vision_min_relevance: 6
  vision_timeout: 120
  vision_think: false
  vision_temperature: 0.0
  vision_num_predict: 220
  vision_force_json: false
  vision_fail_open: true

screenshots:
  max_urls: 5
  captures_per_url: 1

video:
  resolution:
    - 1920
    - 1080
  fps: 30
  bitrate: 12000k
  maxrate: 16000k
  bufsize: 24000k
  codec: auto
  export_backend: fast_ffmpeg
  fast_export_fallback: true
  fast_export_motion: true
  fast_export_preset: fast
  prefer_gpu_encoder: true
  preset: medium
  crf: 18
  nvenc_preset: medium
  nvenc_cq: 19
  audio_bitrate: 192k
  threads: 0
  intro_clip: ./Assets/intro-outro.mp4
  outro_clip: ./Assets/intro-outro.mp4
  transition_duration: 0.5
  music_volume: 0.08
  music_source: musicgen

intro_outro:
  intro_mode: clip_plus_narration
  outro_mode: clip_plus_narration
  intro_text: "Welcome to Trend Forge - where the latest trends, viral moments, and what's next are forged into clear, grounded stories. Let's get into it."
  outro_text: "That's it for today from Trend Forge. Drop your take in the comments, subscribe for what is next, and I will see you in the next one."

motion:
  enabled: true
  source_card_max_zoom: 1.04
  screenshot_max_zoom: 1.08
  ai_art_max_zoom: 1.12
  transition_seconds: 0.45

captions:
  enabled: true
  whisper_model: base
  font: ./Assets/fonts/Inter-Bold.ttf
  font_size: 52
  color: "#FFFFFF"
  outline_color: "#000000"
  outline_width: 2
  position: bottom
  margin_bottom: 60

output:
  directory: ./output/
  temp_directory: ./temp/
  format: mp4
  thumbnail: true
  auto_metadata: true
  quality: high

# Logging
logging:
  level: INFO
  file: ./logs/trendforge.log
