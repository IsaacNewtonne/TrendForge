# TrendForge Configuration
# AI Faceless YouTube Video Generator

opencode:
  base_url: http://localhost:11434/v1
  model: minimax-m2.5:cloud
  temperature: 0.7
  # Local Ollama/OpenCode runs are intentionally uncapped.
  # Set these to numbers only when using a metered/hosted LLM.
  max_tokens:
  input_token_budget:
  analysis_source_chars:
  script_item_chars:

scraping:
  max_sources: 40
  regions:
    - US
    - GB
    - AU
  reddit_subreddits:
    - worldnews
    - technology
    - science
    - todayilearned
  timeout: 30
  delay: 2

research:
  target_source_count: 40
  min_evidence_items: 20
  specialist_sources: true
  allowed_source_domains: []
  blocked_source_domains: []
  source_mix:
    news: 0.42
    reddit: 0.08
    wiki: 0.1
    specialist: 0.4

script:
  target_duration_seconds: 270
  min_duration_seconds: 240
  target_segments: 16
  min_words: 620
  max_words: 780
  narrator_character: "A calm technology documentary host: intelligent, composed, curious, analytical, smooth, reflective, professional, slightly mysterious, polished, and trustworthy. The narrator guides viewers through complex technology, business, and innovation stories like a quiet tech historian explaining the hidden story behind modern inventions and companies. Avoid hype, jokes, shouting, slang, clickbait, and influencer-style energy."
  creative_devices:
    - imagine_if
    - small_scene
    - courtroom
    - two_futures
    - hidden_in_plain_sight
    - contrarian_but_fair

tts:
  engine: kokoro
  voice: bf_isabella
  speed: 1.05
  output_format: wav
  sample_rate: 24000

image:
  # 8 GB VRAM / 16 GB RAM profile: distilled SDXL quality in four steps.
  engine: sdxl
  model_id: Lykon/dreamshaper-xl-lightning
  model_path: ./models/sdxl/
  variant: fp16
  scheduler: dpm_solver_multistep
  # Lightning acceleration is baked into this checkpoint; no extra LoRA needed.
  acceleration: none
  lcm_lora_id: latent-consistency/lcm-lora-sdxl
  lcm_lora_path:
  lcm_lora_scale: 1.0
  lcm_fuse_lora: false
  lcm_steps: 4
  lcm_guidance_scale: 2.0
  dtype: fp16
  vae_dtype: auto
  low_vram_mode: none
  ai_art_enabled: true
  # If fp16 emits black frames, retry automatically with fp32.
  retry_fp32_on_black: true
  steps: 4
  guidance_scale: 2.0
  disable_safety_checker: true
  black_frame_guard: true
  nsfw_retry_attempts: 0
  # Keep AI art enabled for the full run; do not auto-switch to symbolic fallback.
  auto_disable_ai_on_slow_inference: false
  slow_inference_seconds: 160
  # Soft per-image timeout signal; some pipelines may finish current step before stopping.
  max_inference_seconds: 0
  # Emit heartbeat while diffusers inference is running.
  inference_heartbeat_seconds: 12
  # SDXL-native widescreen render, then a light upscale to the 1080p timeline.
  width: 1024
  height: 576
  upscale_to_output: true
  output_width: 1920
  output_height: 1080
  # realesrgan uses ./models/upscalers/RealESRGAN_x4plus.pth when installed.
  # If the optional dependency/model is unavailable, TrendForge falls back to Lanczos.
  upscale_method: lanczos
  realesrgan_model_path: ./models/upscalers/RealESRGAN_x4plus.pth
  realesrgan_model_url: https://github.com/xinntao/Real-ESRGAN/releases/download/v0.1.0/RealESRGAN_x4plus.pth
  realesrgan_tile: 256
  upscale_sharpness: 1.12
  upscale_contrast: 1.02
  negative_prompt: "watermark, logo, readable text, fake text, pseudo text, gibberish text, glyphs, letters, numbers, captions, headline, body text, labels, legends, charts, arrows, callouts, UI panels, flat interface screen, plaque, sign, wordmark, inscription, typography, printed words, garbled typography, misspelled labels, dark neon cyberpunk, black background, blurry, distorted UI, extra fingers, low quality, photorealistic, washed out, low contrast, empty close-up, cluttered layout"
  fallback_stock: pixabay
  # Keep one SDXL component on the GPU at a time; safer at the 8 GB boundary.
  enable_cpu_offload: true
  # Torch 2 uses memory-efficient SDPA; extra attention slicing can slow it down.
  enable_attention_slicing: false
  enable_vae_tiling: true
  # Hard requirement: concept/analogy visuals must come from AI generation.
  require_ai_art: true

visuals:
  source: auto
  visual_planner:
    enabled: true
    require_analysis: true
    model:
    temperature: 0.15
    timeout: 90
    max_tokens:
    json_response_format: true
    max_beats: 20
    max_narration_chars: 18000
    max_evidence_items: 24
  sentence_level:
    enabled: true
  refresh:
    max_hold_seconds: 5
    min_segment_seconds: 8
    max_extra_visuals_per_segment: 2
    evidence_max_hold_seconds: 4
    evidence_max_extra_visuals_per_segment: 2

source_visuals:
  mode: auto
  source_first: true
  target_source_ratio: 0.60
  max_ai_art_segments: 8
  allow_analogy_art: true
  allow_context_art_refreshes: true
  weak_domain_card_fallback: true
  evidence_frame: true
  min_source_match_confidence: 0.45
  screenshot_min_match_confidence: 0.45
  enforce_visual_confirmation_ratio: true
  visual_confirmation_gate_stage: post_visuals
  min_visual_confirmation_ratio: 0.80
  screenshot_quality_threshold: 70
  screenshot_retries: 3
  delay_between_sources: 3
  vision_quality_gate: true
  vision_model: qwen3.5:9b
  vision_base_url: http://localhost:11434
  # Free VRAM after every screenshot check before SDXL image generation begins.
  vision_keep_alive: 0
  vision_min_score: 75
  vision_min_relevance: 6
  vision_timeout: 120
  vision_think: false
  vision_temperature: 0.0
  vision_num_predict: 220
  vision_force_json: false
  vision_fail_open: true

screenshots:
  max_urls: 5
  captures_per_url: 1

video:
  resolution:
    - 1920
    - 1080
  fps: 30
  bitrate: 12000k
  maxrate: 16000k
  bufsize: 24000k
  codec: auto
  export_backend: fast_ffmpeg
  fast_export_fallback: true
  fast_export_preset: fast
  prefer_gpu_encoder: true
  preset: medium
  crf: 18
  nvenc_preset: medium
  nvenc_cq: 19
  audio_bitrate: 192k
  threads: 0
  intro_clip: ./Assets/intro-outro.mp4
  outro_clip: ./Assets/intro-outro.mp4
  transition_duration: 0.5
  music_volume: 0.08
  music_source: musicgen

intro_outro:
  intro_mode: clip_plus_narration
  outro_mode: clip_plus_narration
  clip_target_seconds: 5.0
  intro_text: "Trend Forge. Clear evidence, sharp context, and the story behind what is changing."
  outro_text: "That was Trend Forge. Subscribe for clearer context on what comes next."

motion:
  enabled: true
  source_card_max_zoom: 1.15
  source_screenshot_max_zoom: 1.12
  screenshot_max_zoom: 1.18
  ai_art_max_zoom: 1.25
  transition_seconds: 0.45

captions:
  enabled: true
  whisper_model: base
  font: ./Assets/fonts/Inter-Bold.ttf
  font_size: 52
  color: "#FFFFFF"
  outline_color: "#000000"
  outline_width: 2
  position: bottom
  margin_bottom: 60

output:
  directory: ./output/
  temp_directory: ./temp/
  format: mp4
  thumbnail: true
  auto_metadata: true
  quality: high

# Logging
logging:
  level: INFO
  file: ./logs/trendforge.log
